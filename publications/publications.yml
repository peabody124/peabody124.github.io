- title: "FASCIA: Seeing Beneath the Surface with Queryable, Personalized Anatomy in Any Pose"
  date: "2026-11-21"
  year: 2026
  author: "R. James Cotton, Tim Unger, Lucinda Williamson"
  authors_display: "R. James Cotton, Tim Unger, Lucinda Williamson"
  venue: "arXiv Preprint"
  venue_short: "arXiv"
  venue_type: "preprint"
  summary: "We present FASCIA (Functional Anatomical Structures and Composition via Implicit Atlas), a Momentum Human Rig (MHR)-anchored framework that maps a 290-structure population anatomical template—bones, muscles, viscera, vessels, and adipose tissue—onto each individual through a smooth, invertible diffeomorphic warp conditioned on external body shape and skeletal proportions."
