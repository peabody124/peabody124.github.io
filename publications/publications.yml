  venue: "arXiv Preprint"
  venue_short: "arXiv"
  venue_type: "preprint"
  summary: "We lift single-camera infant video into 3D body surface meshes, articulated infant-scaled biomechanical skeletons, and continuous joint-angle trajectories via Baby Biomechanical 3D Body (BB3D), and train a self-supervised masked spatio-temporal transformer across over one thousand recordings to predict all 32 joint-level BabyOSCAR selective motor control items and early cerebral palsy risk."
